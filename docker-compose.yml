services:
  mysql:
    restart: always
    image: mariadb:10.11
    command: ['mariadbd', '--character-set-server=utf8mb4']
    environment:
      MYSQL_ROOT_PASSWORD: root

  openemr:
    restart: always
    image: openemr/openemr:7.0.2
    ports:
      - "8080:80"
    environment:
      MYSQL_HOST: mysql
      MYSQL_ROOT_PASS: root
